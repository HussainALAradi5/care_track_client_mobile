name: care_track_client_mobile
description: CareTrack patient app for Android and iOS, built on the CareTrack Spring Boot API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_appauth: ^13.0.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  google_fonts: ">=6.2.0 <8.0.0"
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
